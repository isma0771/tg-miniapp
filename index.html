<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IsmaBoost</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0014; --bg2: #12001f; --card: #1a0a2e; --card2: #241040;
            --text: #ffffff; --hint: #9b7fb8; --accent: #b829ff; --accent2: #7b1fa2;
            --glow: rgba(184, 41, 255, 0.35); --border: rgba(184, 41, 255, 0.2);
            --success: #00e676; --error: #ff5252;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #0a0014 0%, #12001f 100%);
            color: var(--text); margin: 0; padding: 0 0 100px 0;
            overflow-x: hidden; -webkit-tap-highlight-color: transparent; min-height: 100vh;
        }
        .container { display: none; padding: 15px; animation: fadeIn 0.3s; }
        .container.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .app-header { text-align: center; padding: 18px 15px 12px; background: linear-gradient(180deg, rgba(184,41,255,0.15) 0%, transparent 100%); border-bottom: 1px solid var(--border); margin-bottom: 15px; }
        .app-logo { font-size: 26px; font-weight: 900; letter-spacing: 2px; background: linear-gradient(90deg, #b829ff, #ff66cc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-shadow: 0 0 30px var(--glow); }
        .app-logo i { -webkit-text-fill-color: var(--accent); margin-right: 6px; }
        .app-sub { font-size: 11px; color: var(--hint); margin-top: 4px; letter-spacing: 1px; }

        .card { background: linear-gradient(135deg, var(--card) 0%, var(--card2) 100%); border-radius: 18px; padding: 18px; margin-bottom: 14px; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .balance-card { background: linear-gradient(135deg, #b829ff 0%, #4a00e0 100%); border: none; text-align: center; padding: 24px; box-shadow: 0 8px 30px var(--glow); }
        .balance-card .label { font-size: 13px; opacity: 0.9; letter-spacing: 1px; }
        .balance-val { font-size: 38px; font-weight: 900; margin: 8px 0 14px; }

        .btn { width: 100%; padding: 15px; border-radius: 14px; border: none; font-size: 15px; font-weight: 800; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); cursor: pointer; transition: 0.2s; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 4px 15px var(--glow); margin-top: 8px; }
        .btn:active { transform: scale(0.96); opacity: 0.85; }
        .btn-sec { background: rgba(184,41,255,0.1); border: 1px solid var(--border); box-shadow: none; }
        .btn-sm { padding: 10px; font-size: 13px; }

        input { width: 100%; padding: 14px; background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 12px; color: #fff; font-size: 15px; margin-bottom: 12px; }
        input::placeholder { color: var(--hint); }
        input:focus { outline: none; border-color: var(--accent); }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin-bottom: 20px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%; background: var(--accent); cursor: pointer; margin-top: -8px; box-shadow: 0 0 10px var(--glow); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; cursor: pointer; background: rgba(184,41,255,0.2); border-radius: 4px; }
        .qty-btn { background: rgba(184,41,255,0.15); border: 1px solid var(--border); color: #fff; font-size: 20px; font-weight: bold; width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
        .qty-btn:active { transform: scale(0.9); }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .cat { background: linear-gradient(135deg, var(--card) 0%, var(--card2) 100%); border-radius: 16px; padding: 18px 10px; text-align: center; cursor: pointer; border: 1px solid var(--border); transition: 0.2s; }
        .cat:active { transform: scale(0.95); background: rgba(184,41,255,0.15); }
        .cat i { font-size: 34px; margin-bottom: 8px; display: block; }
        .cat .cat-name { font-weight: 800; font-size: 13px; }
        .cat .cat-cnt { font-size: 11px; color: var(--hint); margin-top: 3px; }

        .item { display: flex; justify-content: space-between; align-items: center; padding: 14px; background: rgba(0,0,0,0.3); border-radius: 14px; margin-bottom: 10px; border: 1px solid var(--border); transition: 0.2s; cursor: pointer; }
        .item:active { transform: scale(0.98); }
        .item.active { border-color: var(--accent); background: rgba(184,41,255,0.15); box-shadow: 0 0 15px var(--glow); }
        .item-name { font-weight: 700; font-size: 14px; }
        .item-desc { font-size: 11px; color: var(--hint); margin-top: 3px; line-height: 1.4; white-space: pre-line; }
        .item-price { font-weight: 800; color: var(--accent); font-size: 14px; white-space: nowrap; margin-left: 8px; }

        .page-header { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 900; margin-bottom: 18px; letter-spacing: 0.5px; }
        .back-btn { background: rgba(184,41,255,0.15); border: 1px solid var(--border); color: #fff; width: 40px; height: 40px; border-radius: 12px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .back-btn:active { transform: scale(0.92); }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 72px; background: rgba(10,0,20,0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--hint); font-size: 10px; background: none; border: none; gap: 4px; font-weight: 700; padding: 8px; transition: 0.2s; }
        .nav-item.active { color: var(--accent); }
        .nav-item i { font-size: 20px; }

        .footer-tiktok { text-align: center; padding: 18px 15px 8px; font-size: 12px; color: var(--hint); letter-spacing: 1px; }
        .footer-tiktok a { color: var(--accent); text-decoration: none; font-weight: 800; }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; z-index: 1000; opacity: 0; transition: 0.3s; pointer-events: none; border: 1px solid var(--accent); }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="app-header">
    <div class="app-logo"><i class="fas fa-bolt"></i>ISMABOOST</div>
    <div class="app-sub">ULTRA SMM PANEL</div>
</div>

<div id="tab-profile" class="container active">
    <div class="card balance-card">
        <div class="label">💰 ВАШ БАЛАНС</div>
        <div class="balance-val" id="main-balance">0.00 ₽</div>
        <button class="btn btn-sec" style="background:rgba(255,255,255,0.2); margin-bottom: 10px;" onclick="refreshBalance()"><i class="fas fa-sync-alt"></i> Обновить баланс</button>
        <button class="btn btn-sec" style="background:rgba(255,255,255,0.2);" onclick="cmd('/topup')"><i class="fas fa-plus-circle"></i> Пополнить</button>
    </div>
    <div class="card">
        <h3 style="margin:0 0 12px;">📊 Мои действия</h3>
        <button class="btn btn-sec btn-sm" onclick="cmd('/orders')"><i class="fas fa-list"></i> Мои заказы</button>
        <button class="btn btn-sec btn-sm" onclick="cmd('/profile')"><i class="fas fa-user"></i> Профиль / Рефералка</button>
        <button class="btn btn-sec btn-sm" onclick="cmd('/top')"><i class="fas fa-fire"></i> Топ услуги</button>
    </div>
</div>

<div id="tab-social" class="container">
    <div class="page-header"><i class="fas fa-rocket" style="color:var(--accent)"></i> НАКРУТКА</div>
    <div class="grid" id="platforms-grid"></div>
</div>

<div id="screen-services" class="container">
    <div class="page-header">
        <button class="back-btn" onclick="navTo('tab-social')"><i class="fas fa-chevron-left"></i></button>
        <span id="platform-title">Услуги</span>
    </div>
    <div id="services-list"></div>
</div>

<div id="screen-checkout" class="container">
    <div class="page-header">
        <button class="back-btn" onclick="navTo('screen-services')"><i class="fas fa-chevron-left"></i></button>
        <span>Оформление</span>
    </div>
    <div class="card">
        <h3 id="checkout-title" style="margin:0 0 10px;">Услуга</h3>
        <div id="checkout-desc" style="font-size:12px; color:var(--hint); margin-bottom:20px; line-height:1.5; white-space: pre-line;"></div>
        <label style="font-size:13px; font-weight:bold; color:var(--accent); margin-bottom:5px; display:block;">🔗 Ссылка на объект</label>
        <input type="text" id="order-link" placeholder="https://t.me/channel/123" style="margin-bottom:20px;">
        <label style="font-size:13px; font-weight:bold; color:var(--accent); margin-bottom:5px; display:block;">🔢 Количество (мин. 25)</label>
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:15px;">
            <div class="qty-btn" onclick="changeQty(-25)">-</div>
            <input type="number" id="order-qty" value="100" min="25" oninput="updateTotal()" style="text-align:center; font-weight:bold; font-size:18px; margin-bottom:0;">
            <div class="qty-btn" onclick="changeQty(25)">+</div>
        </div>
        <input type="range" id="order-slider" min="25" max="10000" step="25" value="100" oninput="syncQtyFromSlider()">
        <div style="font-size:26px; font-weight:900; text-align:center; margin:25px 0; color:var(--accent);" id="checkout-total">0 ₽</div>
        <button class="btn" onclick="submitOrder()"><i class="fas fa-shopping-cart"></i> Оплатить</button>
        <button class="btn btn-sec" onclick="navTo('screen-services')">Отмена</button>
    </div>
</div>

<div id="tab-games" class="container">
    <div class="page-header"><i class="fas fa-gamepad" style="color:var(--accent)"></i> ИГРЫ</div>
    <div class="grid" id="games-grid"></div>
</div>

<div id="screen-game-items" class="container">
    <div class="page-header">
        <button class="back-btn" onclick="navTo('tab-games')"><i class="fas fa-chevron-left"></i></button>
        <span id="game-title">Игра</span>
    </div>

        <button class="btn" onclick="submitGame()"><i class="fas fa-shopping-cart"></i> Купить</button>
    </div>
</div>

<div id="tab-clicker" class="container">

    <h2 style="text-align:center; font-size:36px; margin:20px 0;" id="tap-score">0</h2>
</div>

<div id="tab-wheel" class="container">
    <div class="page-header" style="justify-content:center;"><i class="fas fa-dharmachakra"></i> КОЛЕСО ФОРТУНЫ</div>
    <div style="position:relative; width:320px; height:320px; margin:30px auto;">
        <div style="position:absolute; top:-25px; left:50%; transform:translateX(-50%); font-size:50px; z-index:10; color:#fff; text-shadow:0 0 20px var(--glow);">▼</div>
        <div id="wheel-wrapper" style="width:100%; height:100%; transition: transform 5s cubic-bezier(0.15, 0.9, 0.25, 1); filter: drop-shadow(0 0 30px var(--glow));">
            <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:100%;">
                <g id="wheel-sectors"></g>
                <circle cx="200" cy="200" r="195" fill="none" stroke="var(--accent)" stroke-width="10"/>
                <circle cx="200" cy="200" r="40" fill="#0a0014" stroke="var(--accent)" stroke-width="4"/>
                <text x="200" y="212" text-anchor="middle" font-size="30" fill="var(--accent)" font-weight="bold">🎁</text>
            </svg>
        </div>
    </div>
    <div style="text-align:center; font-weight:800; font-size:18px; color:var(--accent); height:32px; margin-top:10px;" id="wheel-text"></div>
    <button class="btn" onclick="spinWheel()" style="margin-top:20px;"><i class="fas fa-dharmachakra"></i> Крутить за 150 ₽</button>
    
    <div id="wheel-prize-block" style="display:none; margin-top:20px;">
        <div class="card" style="border: 1px solid var(--accent); background: rgba(184,41,255,0.1);">
            <h4 style="margin:0 0 10px; color:var(--accent);">🎉 Введите ссылку для активации приза:</h4>
            <input type="text" id="wheel-prize-link" placeholder="https://t.me/channel/123">
            <button class="btn" onclick="activatePrize()">🎁 Активировать приз</button>
        </div>
    </div>
</div>

<div class="footer-tiktok">
    <i class="fab fa-tiktok" style="color:var(--accent);"></i> мой тик ток
    <a href="https://tiktok.com/@ismaaaa983" target="_blank">ismaaaa983</a>
</div>

<div class="bottom-nav">
    <button class="nav-item active" onclick="switchTab(this,'tab-profile')"><i class="fas fa-user"></i>Профиль</button>
    <button class="nav-item" onclick="switchTab(this,'tab-social')"><i class="fas fa-rocket"></i>Накрутка</button>
    <button class="nav-item" onclick="switchTab(this,'tab-games')"><i class="fas fa-gamepad"></i>Игры</button>
    <button class="nav-item" onclick="switchTab(this,'tab-clicker')"><i class="fas fa-hand-pointer"></i>Тапалка</button>
    <button class="nav-item" onclick="switchTab(this,'tab-wheel')"><i class="fas fa-dharmachakra"></i>Рулетка</button>
</div>
<script>
    const tg = window.Telegram.WebApp;
    tg.expand(); tg.ready();

    const urlParams = new URLSearchParams(window.location.search);
    let userBalance = parseFloat(urlParams.get('bal')) || 0;
    const userId = tg.initDataUnsafe?.user?.id || 0;
    
    function updateBalanceUI() {
        document.getElementById('main-balance').innerText = userBalance.toFixed(2) + ' ₽';
    }
    updateBalanceUI();

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.borderColor = isError ? 'var(--error)' : 'var(--success)';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function sendToBot(data) { 
        data.user_id = userId;
        data.current_balance = userBalance; 
        tg.sendData(JSON.stringify(data)); 
        tg.close(); 
    }
    
    function cmd(text) { sendToBot({action: 'command', text: text}); }

    function refreshBalance() {
        let url = new URL(window.location.href);
        url.searchParams.set('t', Date.now());
        window.location.href = url.toString();
    }

    function switchTab(btn, tabId) {
        document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
        window.scrollTo(0, 0);
    }
    function navTo(id) {
        document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        window.scrollTo(0, 0);
    }

function changeQty(amount) {

        newVal = parseInt(document.getElementById('order-slider').max);
    }
    input.value = newVal;
    document.getElementById('order-slider').value = newVal;
    updateTotal();
}

function updateTotal() {

    let total = (currentItem.price / currentItem.pack) * qty;
    document.getElementById('checkout-total').innerText = total.toFixed(2) + ' ₽';

const WHEEL_PRIZES = ["💀 Пусто", "👀 1000 TT", "❤️ 100 IG", "👀 5000 IG", "❤️ 500 TT", "💾 500 TT", "🔁 500 TT", "👀 5000 YT", "👀 5000 VK", "👀 5000 RT", "👥 500 TG", "👀 10000 TG", "🚀 5000 Бот", "🚀 500 Реак", "❤️ 500 YT", "👥 500 TT", "📊 5000 IG", "🌟 100 Звёзд", "👑 1000 TG"];
const WHEEL_COLORS = ["#b829ff", "#4a00e0", "#7b1fa2", "#2d1b4e", "#8a2be2", "#6a1b9a", "#4a148c", "#9c27b0", "#673ab7", "#512da8"];
const WHEEL_PRICE = 150; 

const sectorsGroup = document.getElementById('wheel-sectors');
const numSectors = WHEEL_PRIZES.length;
const anglePerSector = 360 / numSectors;

function polarToCartesian(cx, cy, r, angleDeg) {
    const angleRad = (angleDeg - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(angleRad), y: cy + r * Math.sin(angleRad) };
}

function describeArc(cx, cy, r, startAngle, endAngle) {
    const start = polarToCartesian(cx, cy, r, endAngle);
    const end = polarToCartesian(cx, cy, r, startAngle);
    const largeArc = endAngle - startAngle <= 180 ? "0" : "1";
    return `M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${largeArc} 0 ${end.x} ${end.y} Z`;
}

for (let i = 0; i < numSectors; i++) {
    const startAngle = i * anglePerSector;
    const endAngle = (i + 1) * anglePerSector;
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", describeArc(200, 200, 185, startAngle, endAngle));
    path.setAttribute("fill", WHEEL_COLORS[i % WHEEL_COLORS.length]);
    path.setAttribute("stroke", "#0a0014");
    path.setAttribute("stroke-width", "2");
    sectorsGroup.appendChild(path);

    const midAngle = startAngle + anglePerSector / 2;
    const textPos = polarToCartesian(200, 200, 125, midAngle);
    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
    text.setAttribute("x", textPos.x); text.setAttribute("y", textPos.y);
    text.setAttribute("text-anchor", "middle"); text.setAttribute("dominant-baseline", "middle");
    text.setAttribute("font-size", "11"); text.setAttribute("font-weight", "bold");
    text.setAttribute("fill", "#fff");
    text.setAttribute("transform", `rotate(${midAngle}, ${textPos.x}, ${textPos.y})`);
    text.textContent = WHEEL_PRIZES[i];
    sectorsGroup.appendChild(text);
}

let wheelDeg = 0; let isSpinning = false; let currentWheelPrize = "";

function spinWheel() {
    if (isSpinning) return;
    if (userBalance < WHEEL_PRICE) return tg.showAlert("Недостаточно средств! Прокрут стоит 150 ₽.");
    
    userBalance -= WHEEL_PRICE;
    updateBalanceUI();

    isSpinning = true;
    document.getElementById('wheel-text').innerText = "Крутим... 🎲";
    document.getElementById('wheel-prize-block').style.display = 'none';

    const winIndex = Math.floor(Math.random() * numSectors);
    currentWheelPrize = WHEEL_PRIZES[winIndex];
    const midAngle = winIndex * anglePerSector + anglePerSector / 2;
    const totalRotation = 360 * 6 + (360 - midAngle);

    wheelDeg += totalRotation;
    document.getElementById('wheel-wrapper').style.transform = `rotate(${wheelDeg}deg)`;

    setTimeout(() => {
        isSpinning = false;
        if (winIndex === 0) {
            document.getElementById('wheel-text').innerText = "💀 Пусто... Повезет в следующий раз!";
            sendToBot({action:"blindbox", link: "empty", price: WHEEL_PRICE});
        } else {
            document.getElementById('wheel-text').innerText = `🎁 Вы выиграли: ${currentWheelPrize}`;
            document.getElementById('wheel-prize-block').style.display = 'block';
        }
    }, 5200);
}

function activatePrize() {
    let link = document.getElementById('wheel-prize-link').value.trim();
    if (link.length < 3) return tg.showAlert("Пожалуйста, введите ссылку!");
    
    tg.showPopup({
        title: 'Активация',
        message: `Активировать приз: ${currentWheelPrize}?`,
        buttons: [{id: 'cancel', type: 'cancel'}, {id: 'ok', type: 'default', text: 'Активировать'}]
    }, function(buttonId) {
        if (buttonId === 'ok') sendToBot({action:"blindbox", link: link, prize: currentWheelPrize, price: WHEEL_PRICE});
    });
}
