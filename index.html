<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IsmaBoost Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #1c1c1e);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #8e8e93);
            --button-color: var(--tg-theme-button-color, #0a84ff);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #2c2c2e);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Шапка профиля */
        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        .avatar {
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #FF9A9E 0%, #FECFEF 99%, #FECFEF 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #000;
        }
        .user-info h1 { margin: 0; font-size: 20px; }
        .user-info p { margin: 5px 0 0; color: var(--hint-color); font-size: 14px; }

        /* Карточка баланса */
        .balance-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 20px;
            color: white;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.4);
        }
        .balance-card p { margin: 0; font-size: 14px; opacity: 0.9; }
        .balance-card h2 { margin: 10px 0; font-size: 32px; font-weight: 800; }
        
        .topup-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: bold;
            backdrop-filter: blur(5px);
            width: 100%;
            margin-top: 10px;
        }

        /* Категории */
        .section-title { font-size: 18px; margin-bottom: 15px; font-weight: bold; }
        .categories {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .category-btn {
            background-color: var(--secondary-bg);
            border: none;
            color: var(--text-color);
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .category-btn i { font-size: 24px; color: var(--button-color); }
        .cat-tg i { color: #0088cc; }
        .cat-tt i { color: #ff0050; }
        .cat-game i { color: #ff9900; }
        .cat-box i { color: #ff4757; }
    </style>
</head>
<body>

    <div class="header">
        <div class="avatar" id="user-avatar">?</div>
        <div class="user-info">
            <h1 id="user-name">Загрузка...</h1>
            <p>💎 Статус: <span id="user-status">Базовый</span></p>
        </div>
    </div>

    <div class="balance-card">
        <p>Ваш баланс</p>
        <h2>0.00 ₽</h2>
        <button class="topup-btn"><i class="fas fa-wallet"></i> Пополнить CryptoBot</button>
    </div>

    <div class="section-title">Быстрый заказ</div>
    <div class="categories">
        <button class="category-btn cat-tg">
            <i class="fab fa-telegram-plane"></i>
            Telegram
        </button>
        <button class="category-btn cat-tt">
            <i class="fab fa-tiktok"></i>
            TikTok
        </button>
        <button class="category-btn cat-game">
            <i class="fas fa-gamepad"></i>
            Игры и Донат
        </button>
        <button class="category-btn cat-box">
            <i class="fas fa-box-open"></i>
            Слепая Коробка
        </button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.ready();

        let user = tg.initDataUnsafe.user;
        if (user) {
            document.getElementById('user-name').innerText = user.first_name;
            document.getElementById('user-avatar').innerText = user.first_name.charAt(0).toUpperCase();
            
            // Если у пользователя есть премиум
            if (user.is_premium) {
                document.getElementById('user-status').innerText = "Premium";
                document.getElementById('user-status').style.color = "#FFD700";
            }
        }
        
        // Включаем главную кнопку Telegram внизу экрана
        tg.MainButton.setText("ЗАКРЫТЬ ПРИЛОЖЕНИЕ");
        tg.MainButton.show();
        tg.MainButton.onClick(function() {
            tg.close();
        });
    </script>
</body>
</html>
